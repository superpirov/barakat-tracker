<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Баракат — трекер задач</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* тема до отрисовки — без мигания */
try{
  var s = JSON.parse(localStorage.getItem('barakat.v1')||'{}');
  var th = (s.settings&&s.settings.theme) || ((new Date().getHours()>=19||new Date().getHours()<7)?'dark':'light');
  document.documentElement.dataset.theme = th;
}catch(e){document.documentElement.dataset.theme='light'}
</script>
<style>
:root{--fd:'Unbounded',sans-serif;--fb:'Golos Text',system-ui,sans-serif;--rl:20px;--rm:14px;--rs:10px}
html[data-theme="light"]{
  --bg:#F2F4EF;--panel:#FFFFFF;--panel2:#F5F7F2;--ink:#1B211D;--muted:#69736C;--line:#E2E6DD;
  --dot:rgba(27,33,29,.10);--accent:#2E7D5B;--accent-ink:#fff;
  --tint1:rgba(52,184,126,.15);--tint2:rgba(232,162,59,.13);
  --shadow:0 10px 28px rgba(27,33,29,.07);--danger:#D8484E;--warn:#C97F12;color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0F1411;--panel:#171E19;--panel2:#1D2620;--ink:#E9EFEA;--muted:#8FA094;--line:#28342B;
  --dot:rgba(233,239,234,.07);--accent:#4CC38A;--accent-ink:#08130C;
  --tint1:rgba(76,195,138,.12);--tint2:rgba(232,162,59,.09);
  --shadow:0 14px 34px rgba(0,0,0,.38);--danger:#FF6B6E;--warn:#F2A63B;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;transition:background .35s,color .35s}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(620px 420px at 6% -6%,var(--tint1),transparent 62%),
  radial-gradient(720px 520px at 104% 108%,var(--tint2),transparent 62%)}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#fx{position:fixed;inset:0;z-index:98;pointer-events:none}

.app{position:relative;z-index:1;display:grid;grid-template-columns:272px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:26px 24px 56px}

/* ── сайдбар ── */
.sidebar{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:18px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 2px}
.brand-star{color:var(--accent);font-size:22px;animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.82) rotate(20deg)}}
.brand-name{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:.5px}
.brand-sub{padding:0 8px 12px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.cat-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;transition:background .18s,box-shadow .18s;border:1px solid transparent}
.cat-row:hover{background:var(--panel2)}
.cat-row.on{background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent)}
.cat-emoji{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.cat-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.cat-del{flex:none;width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:0;transition:.18s}
.cat-row:hover .cat-del{opacity:1}
.cat-del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.add-cat{width:100%;margin-top:10px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;transition:.2s}
.add-cat:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.side-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.ibtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;font-size:15px;transition:.18s}
.ibtn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.side-hint{margin-left:auto;font-size:10.5px;color:var(--muted);text-align:right;line-height:1.4}

/* ── шапка дня ── */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.dateline{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.dateline b{color:var(--accent);font-weight:700}
.greet{font-family:var(--fd);font-weight:700;font-size:clamp(25px,4vw,38px);line-height:1.15;margin:8px 0 9px}
.quote{color:var(--muted);font-size:14px;max-width:540px;line-height:1.5}
.head-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ring-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 18px;box-shadow:var(--shadow)}
.ring-wrap{position:relative;width:70px;height:70px}
.ring-wrap svg{width:70px;height:70px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--panel2);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201;transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.ring-pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:14px}
.ring-info b{display:block;font-size:14px;margin-bottom:3px}
.ring-info small{color:var(--muted);font-size:12.5px}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;gap:7px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}

/* ── мобильная шапка ── */
.m-bar{display:none;align-items:center;gap:10px;margin-bottom:6px}
.m-cats{display:none;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.m-cats::-webkit-scrollbar{display:none}

/* ── композер ── */
.composer{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:16px 18px 16px;box-shadow:var(--shadow)}
.composer.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#newText{width:100%;background:transparent;border:0;outline:none;font:600 18px var(--fb);color:var(--ink);padding:6px 2px}
#newText::placeholder{color:var(--muted);font-weight:500}
.composer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:180px;padding:2px;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 94%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;gap:6px;align-items:center;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap}
.chip:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c,#888) 55%,var(--line))}
.chip.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 5px 14px color-mix(in srgb,var(--c) 40%,transparent)}
.prio-pick{display:flex;gap:5px}
.prio{width:34px;height:34px;border-radius:var(--rs);border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;transition:.18s}
.prio svg{width:15px;height:15px;fill:var(--muted);transition:.18s}
.prio:hover{transform:translateY(-2px)}
.prio.on[data-p="low"] svg{fill:#8FA0AE}.prio.on[data-p="mid"] svg{fill:#E8A23B}.prio.on[data-p="high"] svg{fill:#E5484D}
.prio.on{border-color:currentColor;box-shadow:0 3px 10px rgba(0,0,0,.10)}
.datein{border:1.5px solid var(--line);border-radius:var(--rs);padding:7px 10px;background:var(--panel2);color:var(--ink);font:500 13px var(--fb);cursor:pointer}
.btn-add{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;padding:11px 19px;border-radius:13px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 38%,transparent);transition:.18s}
.btn-add:hover{transform:translateY(-2px)}
.btn-add:active{transform:scale(.96)}

/* ── вкладки и поиск ── */
.board-bar{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;transition:.2s;display:flex;gap:7px;align-items:center}
.tab .cnt{font-size:11px;font-weight:700;background:color-mix(in srgb,var(--muted) 16%,transparent);padding:1px 7px;border-radius:999px}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.10)}
.search{position:relative;margin-left:auto;flex:1;max-width:250px;min-width:160px}
.search input{width:100%;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);padding:9px 14px 9px 36px;font:500 13.5px var(--fb);color:var(--ink);outline:none;transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
#clearDone{border:1.5px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s}
#clearDone:hover{color:var(--danger);border-color:var(--danger)}

/* ── задачи ── */
.tasks{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.task{position:relative;display:flex;gap:13px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--rm);padding:14px 14px 14px 20px;transition:transform .18s,box-shadow .18s,border-color .18s,opacity .3s}
.task::before{content:'';position:absolute;left:0;top:13px;bottom:13px;width:4px;border-radius:4px;background:var(--c)}
.task:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 38%,var(--line));box-shadow:0 8px 22px color-mix(in srgb,var(--c) 15%,transparent)}
.task.enter{animation:rise .45s cubic-bezier(.2,.7,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.task.dragging{opacity:.45;transform:scale(.98)}
.task.removing{opacity:0;transform:translateX(26px) scale(.96)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:background .28s,transform .15s,box-shadow .2s}
.check:hover{transform:scale(1.14);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 15%,transparent)}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .32s .06s}
.task.done .check,.task.finishing .check{background:var(--c)}
.task.done .check svg,.task.finishing .check svg{stroke-dashoffset:0}
.t-main{flex:1;min-width:0}
.t-text{font-weight:600;font-size:15px;position:relative;display:inline;line-height:1.45;word-break:break-word}
.t-text::after{content:'';position:absolute;left:-2px;right:auto;top:54%;height:2px;width:0;border-radius:2px;background:var(--muted);transition:width .5s cubic-bezier(.3,.8,.3,1)}
.task.done .t-text::after,.task.finishing .t-text::after{width:calc(100% + 4px)}
.task.done{opacity:.6}
.task.done .t-text{color:var(--muted)}
.t-meta{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc)}
.mchip.due-today{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.mchip.due-over{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.t-actions{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.task:hover .t-actions{opacity:1}
.icon-btn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.icon-btn:hover{background:var(--panel2);color:var(--ink)}
.icon-btn.del:hover{color:var(--danger)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t-edit{width:100%;font:600 15px var(--fb);color:var(--ink);background:var(--panel2);border:1.5px solid var(--accent);border-radius:8px;padding:6px 9px;outline:none}
.empty{text-align:center;padding:54px 20px;color:var(--muted)}
.empty svg{margin-bottom:14px;stroke:var(--muted);opacity:.55;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty b{display:block;font-family:var(--fd);font-weight:700;font-size:16px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px}
footer{margin-top:44px;text-align:center;font-size:12px;color:var(--muted)}

/* ── тост, диалог ── */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.32s cubic-bezier(.3,.8,.3,1);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:99;box-shadow:0 12px 34px rgba(0,0,0,.3);font-size:14px;font-weight:600}
#toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
dialog{border:0;border-radius:var(--rl);background:var(--panel);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.35);padding:0}
dialog::backdrop{background:rgba(8,12,10,.5);backdrop-filter:blur(3px)}
.dlg-card{padding:24px;display:flex;flex-direction:column;gap:16px;min-width:min(360px,86vw)}
.dlg-card h3{font-family:var(--fd);font-weight:700;font-size:17px}
.dlg-card label{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:7px}
.dlg-card input[type=text]{border:1.5px solid var(--line);border-radius:var(--rs);background:var(--panel2);padding:10px 12px;font:600 15px var(--fb);color:var(--ink);outline:none}
.dlg-card input[type=text]:focus{border-color:var(--accent)}
.egrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.egrid button{width:32px;height:32px;font-size:16px;border-radius:8px;border:1.5px solid transparent;background:var(--panel2);cursor:pointer;transition:.15s}
.egrid button:hover{transform:scale(1.12)}
.egrid button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cgrid{display:flex;gap:8px;flex-wrap:wrap}
.cgrid button{width:27px;height:27px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s}
.cgrid button:hover{transform:scale(1.15)}
.cgrid button.on{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 20%,transparent)}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.gbtn{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.18s}
.gbtn:hover{background:var(--panel2)}

@media(hover:none){.t-actions{opacity:1}.cat-del{opacity:.7}}
@media(max-width:960px){
  .app{grid-template-columns:1fr;gap:14px;padding:16px 14px 48px}
  .sidebar{display:none}
  .m-bar{display:flex}
  .m-cats{display:flex}
  .top{flex-direction:column;align-items:flex-start;gap:16px}
  .head-right{width:100%;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="app">
  <!-- САЙДБАР -->
  <aside class="sidebar">
    <div class="brand"><span class="brand-star">✦</span><span class="brand-name">Баракат</span></div>
    <div class="brand-sub">трекер задач</div>
    <div class="nav-label">Категории</div>
    <nav class="nav" id="catNav"></nav>
    <button class="add-cat" id="addCatBtn">＋ Новая категория</button>
    <div class="side-foot">
      <button class="ibtn theme-btn" title="Сменить тему"></button>
      <button class="ibtn sound-btn" title="Звук"></button>
      <span class="side-hint">данные хранятся<br>в вашем браузере</span>
    </div>
  </aside>

  <main>
    <!-- мобильная шапка -->
    <div class="m-bar">
      <div class="brand"><span class="brand-star">✦</span><span class="brand-name">Баракат</span></div>
      <span style="flex:1"></span>
      <button class="ibtn theme-btn"></button>
      <button class="ibtn sound-btn"></button>
    </div>
    <div class="m-cats" id="catNavM"></div>

    <!-- ШАПКА ДНЯ -->
    <header class="top">
      <div>
        <div class="dateline" id="dateline"></div>
        <h1 class="greet" id="greet"></h1>
        <p class="quote" id="quote"></p>
      </div>
      <div class="head-right">
        <div class="ring-card">
          <div class="ring-wrap">
            <svg viewBox="0 0 76 76"><circle class="ring-bg" cx="38" cy="38" r="32"/><circle class="ring-fg" id="ringFg" cx="38" cy="38" r="32"/></svg>
            <div class="ring-pct" id="ringPct">0%</div>
          </div>
          <div class="ring-info"><b>Прогресс</b><small><span id="ringDone">0</span> из <span id="ringTotal">0</span> выполнено</small></div>
        </div>
        <div class="pills">
          <span class="pill">🔥 серия: <b id="streakN">0</b></span>
          <span class="pill">✅ всего: <b id="totalN">0</b></span>
        </div>
      </div>
    </header>

    <!-- КОМПОЗЕР -->
    <section class="composer" id="composer">
      <input id="newText" placeholder="Что нужно сделать?" maxlength="140" autocomplete="off">
      <div class="composer-row">
        <div class="chips" id="catPicker"></div>
        <div class="prio-pick" id="prioPick" title="Приоритет">
          <button class="prio" data-p="low" title="Низкий"><svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h10l-2.5 3.5L16 11H6"/></svg></button>
          <button class="prio" data-p="mid" title="Средний"><svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h10l-2.5 3.5L16 11H6"/></svg></button>
          <button class="prio" data-p="high" title="Высокий"><svg viewBox="0 0 24 24"><path d="M6 3v18M6 4h10l-2.5 3.5L16 11H6"/></svg></button>
        </div>
        <input type="date" class="datein" id="newDue" title="Срок">
        <button class="btn-add" id="addBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
      </div>
    </section>

    <!-- ВКЛАДКИ -->
    <div class="board-bar">
      <div class="tabs">
        <button class="tab on" data-tab="active">Активные <span class="cnt" id="cntA">0</span></button>
        <button class="tab" data-tab="done">Выполненные <span class="cnt" id="cntD">0</span></button>
      </div>
      <button id="clearDone" style="display:none">Очистить выполненные</button>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" placeholder="Поиск…  ( / )">
      </div>
    </div>

    <ul class="tasks" id="list"></ul>
    <footer>✦ Баракат — пусть каждый день будет благословенным</footer>
  </main>
</div>

<!-- ДИАЛОГ КАТЕГОРИИ -->
<dialog id="dlg">
  <form class="dlg-card" id="catForm">
    <h3>Новая категория</h3>
    <label>Название<input type="text" id="catName" maxlength="20" required placeholder="Например: Путешествия" autocomplete="off"></label>
    <label>Эмодзи<div class="egrid" id="egrid" style="text-transform:none"></div></label>
    <label>Цвет<div class="cgrid" id="cgrid" style="text-transform:none"></div></label>
    <div class="dlg-actions">
      <button type="button" class="gbtn" id="dlgCancel">Отмена</button>
      <button type="submit" class="btn-add">Создать</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='barakat.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,f)=>{n=Math.abs(n)%100;const d=n%10;if(n>10&&n<20)return f[2];if(d>1&&d<5)return f[1];if(d===1)return f[0];return f[2]};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const PALETTE=['#9AA7B2','#F0645C','#E86FB0','#E8A23B','#D97B29','#7BC142','#34B87E','#2BB3A5','#4A8DF7','#9A6FE0'];
const EMOJIS=['✨','🌙','🕌','📚','💪','🧺','🚗','🎯','💡','🎨','🧠','🍎','✈️','💰','🌿','🤲','📞','🎁','🧹','🌟'];
const QUOTES=[
 '«Самые любимые дела — те, что совершаются постоянно, даже если они малы» (хадис)',
 '«Маленький шаг каждый день превращается в большой путь»',
 '«Не откладывай на завтра то, что можешь сделать сегодня»',
 '«Порядок в делах — спокойствие в сердце»',
 '«Сначала самое важное — остальное станет проще»',
 '«Дисциплина — это мост между целью и результатом»',
 '«Спланируй вечер — и утро скажет тебе спасибо»',
 '«Доводи начатое до конца — в этом и есть мастерство»'];

/* ── состояние ── */
function defaults(){return{
 v:1, filter:'all', tab:'active', search:'', newCat:'general', newPrio:null,
 settings:{theme:null,sound:true},
 cats:[
  {id:'general',name:'Общие',emoji:'✨',color:'#9AA7B2',fixed:true},
  {id:'c-pers',name:'Личное',emoji:'🌿',color:'#F0645C'},
  {id:'c-work',name:'Работа',emoji:'💼',color:'#4A8DF7'},
  {id:'c-shop',name:'Покупки',emoji:'🛒',color:'#E8A23B'},
  {id:'c-deen',name:'Ибадат',emoji:'🕌',color:'#2BB3A5'},
  {id:'c-hlth',name:'Здоровье',emoji:'💧',color:'#34B87E'},
  {id:'c-stdy',name:'Учёба',emoji:'📚',color:'#9A6FE0'},
  {id:'c-home',name:'Дом',emoji:'🏡',color:'#E86FB0'}],
 tasks:[]}}

let state=defaults();
function seed(){const n=Date.now();state.tasks=[
 {id:uid(),text:'Составить список целей на неделю',catId:'general',prio:null,due:null,done:true,createdAt:n-9e5,completedAt:n-6e5},
 {id:uid(),text:'Купить финики и мёд',catId:'c-shop',prio:'mid',due:ymd(new Date()),done:false,createdAt:n-8e5},
 {id:uid(),text:'Подготовить отчёт для команды',catId:'c-work',prio:'high',due:null,done:false,createdAt:n-7e5},
 {id:uid(),text:'Прочитать 20 страниц книги',catId:'c-pers',prio:'low',due:null,done:false,createdAt:n-6e5},
 {id:uid(),text:'Вечерняя прогулка 30 минут',catId:'c-hlth',prio:null,due:null,done:false,createdAt:n-5e5}];}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,search:''}))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(!r){seed();return}
 const d=JSON.parse(r);state={...state,...d,settings:{...state.settings,...(d.settings||{})},search:''};
 if(!state.cats.find(c=>c.id==='general'))state.cats.unshift({id:'general',name:'Общие',emoji:'✨',color:'#9AA7B2',fixed:true});
 state.tasks.forEach(t=>{if(!catById(t.catId))t.catId='general'});
}catch(e){seed()}}
const catById=id=>state.cats.find(c=>c.id===id)||state.cats[0];
const byId=id=>state.tasks.find(t=>t.id===id);

/* ── звук ── */
let AC=null;
const tone=(f,dur=.12,type='triangle',g=.13,delay=0)=>{if(!state.settings.sound)return;try{
 AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();
 o.type=type;o.frequency.value=f;const t0=AC.currentTime+delay;
 gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t0+.012);gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 o.connect(gn).connect(AC.destination);o.start(t0);o.stop(t0+dur+.03)}catch(e){}};
const sndPop=()=>{tone(740,.1);tone(988,.14,'sine',.09,.07)};
const sndTick=()=>tone(520,.06,'sine',.07);
const sndFanfare=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.13,i*.1));

/* ── конфетти ── */
const cvs=$('#fx'),ctx=cvs.getContext('2d');let parts=[],raf=0;
const sizeCvs=()=>{cvs.width=innerWidth;cvs.height=innerHeight};sizeCvs();addEventListener('resize',sizeCvs);
function burst(x,y,colors,count=26,power=1){
 for(let i=0;i<count;i++)parts.push({x,y,vx:(Math.random()-.5)*9*power,vy:(Math.random()*-6-2)*power,g:.19,
  s:Math.random()*5+3.5,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],life:1,decay:.012+Math.random()*.012});
 if(!raf)raf=requestAnimationFrame(loop);}
function loop(){ctx.clearRect(0,0,cvs.width,cvs.height);
 parts=parts.filter(p=>p.life>0);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=p.vr;p.life-=p.decay;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(p.life,0);
  ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.5);ctx.restore()});
 if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;ctx.clearRect(0,0,cvs.width,cvs.height)}}
const FXC=['#F0645C','#E8A23B','#34B87E','#4A8DF7','#2BB3A5','#E86FB0','#F2C14E'];

/* ── тост ── */
let toastT;
function toast(msg,undo){const el=$('#toast');
 el.innerHTML=`<span>${msg}</span>${undo?'<button type="button">Отменить</button>':''}`;
 if(undo)el.querySelector('button').onclick=()=>{undo();hideToast()};
 el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(hideToast,4200);}
const hideToast=()=>$('#toast').classList.remove('show');

/* ── фильтрация ── */
const matchF=t=>state.filter==='all'||t.catId===state.filter;
const matchS=t=>!state.search||t.text.toLowerCase().includes(state.search);
const scoped=()=>state.tasks.filter(matchF);

/* ── рендер: категории ── */
function renderNav(){
 const act=state.tasks.filter(t=>!t.done);
 const row=(id,emoji,name,color,count,fixed)=>`
  <div class="cat-row ${state.filter===id?'on':''}" data-f="${id}" style="--c:${color}">
   <span class="cat-emoji">${emoji}</span><span class="cat-name">${esc(name)}</span>
   <span class="cnt">${count}</span>
   ${fixed?'':`<button class="cat-del" data-del="${id}" title="Удалить категорию"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>`}
  </div>`;
 $('#catNav').innerHTML=row('all','🗂️','Все задачи','#8A9AA8',act.length,true)
  +state.cats.map(c=>row(c.id,c.emoji,c.name,c.color,act.filter(t=>t.catId===c.id).length,c.fixed)).join('');
 $('#catNavM').innerHTML=`<button class="chip ${state.filter==='all'?'on':''}" data-f="all" style="--c:#8A9AA8">🗂️ Все</button>`
  +state.cats.map(c=>`<button class="chip ${state.filter===c.id?'on':''}" data-f="${c.id}" style="--c:${c.color}">${c.emoji} ${esc(c.name)}</button>`).join('');
 renderPicker();}
function renderPicker(){
 $('#catPicker').innerHTML=state.cats.map(c=>
  `<button class="chip ${state.newCat===c.id?'on':''}" data-pick="${c.id}" style="--c:${c.color}">${c.emoji} ${esc(c.name)}</button>`).join('');}

/* ── рендер: вкладки и список ── */
function renderTabs(){
 const s=scoped();
 $('#cntA').textContent=s.filter(t=>!t.done).length;
 $('#cntD').textContent=s.filter(t=>t.done).length;
 $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
 $('#clearDone').style.display=(state.tab==='done'&&s.some(t=>t.done))?'':'none';}

const PRIO={low:['Низкий','#8FA0AE'],mid:['Средний','#E8A23B'],high:['Высокий','#E5484D']};
function dueChip(t){if(!t.due)return'';
 const today=ymd(new Date()),d=t.due;
 let cls='',label='📅 '+new Date(d+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
 if(d<today){cls='due-over';label='⏰ Просрочено'}
 else if(d===today){cls='due-today';label='📅 Сегодня'}
 else{const diff=Math.round((new Date(d)-new Date(today))/864e5);if(diff===1)label='📅 Завтра'}
 return `<span class="mchip ${cls}">${label}</span>`;}
function itemHTML(t,i){
 const c=catById(t.catId);
 const draggable=state.tab==='active'&&!state.search&&state.filter==='all'&&!t.done;
 const editing=state.editing===t.id;
 return `<li class="task ${t.done?'done':''} enter" data-id="${t.id}" style="--c:${c.color};animation-delay:${Math.min(i,10)*.035}s" ${draggable?'draggable="true"':''}>
  <button class="check" title="${t.done?'Вернуть в работу':'Отметить выполненной'}"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.2 5L20 6.8"/></svg></button>
  <div class="t-main">
    ${editing
      ?`<input class="t-edit" value="${esc(t.text)}" maxlength="140">`
      :`<span class="t-text">${esc(t.text)}</span>`}
    <div class="t-meta">
      <span class="mchip" style="--cc:${c.color}">${c.emoji} ${esc(c.name)}</span>
      ${t.prio?`<span class="mchip" style="--cc:${PRIO[t.prio][1]}">⚑ ${PRIO[t.prio][0]}</span>`:''}
      ${dueChip(t)}
    </div>
  </div>
  <div class="t-actions">
    ${!t.done&&!editing?`<button class="icon-btn" data-act="edit" title="Редактировать"><svg viewBox="0 0 24 24"><path d="M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20z"/></svg></button>`:''}
    <button class="icon-btn del" data-act="del" title="Удалить"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>
  </div></li>`;}
function emptyHTML(){
 if(state.search)return `<div class="empty"><b>Ничего не найдено</b><p>Попробуйте другой запрос</p></div>`;
 return state.tab==='active'
  ?`<div class="empty"><svg width="110" height="86" viewBox="0 0 110 86"><circle cx="44" cy="44" r="26"/><path d="M34 44l7 7 14-15"/><path d="M84 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></svg><b>Здесь пока пусто</b><p>Добавьте первую задачу — начните с малого ✨</p></div>`
  :`<div class="empty"><svg width="110" height="86" viewBox="0 0 110 86"><rect x="20" y="18" width="70" height="52" rx="10"/><path d="M38 38l6 6 12-13"/><path d="M36 56h38"/></svg><b>Пока ничего не выполнено</b><p>Отметьте задачу галочкой — она переедет сюда</p></div>`;}
function renderList(){
 let list=state.tasks.filter(t=>state.tab==='done'?t.done:!t.done).filter(matchF).filter(matchS);
 if(state.tab==='done')list.sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
 $('#list').innerHTML=list.length?list.map(itemHTML).join(''):emptyHTML();
 if(state.editing){const inp=$('#list .t-edit');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}}

/* ── рендер: статистика ── */
function renderStats(){
 const s=scoped(),done=s.filter(t=>t.done).length,total=s.length;
 const pct=total?Math.round(done/total*100):0;
 $('#ringFg').style.strokeDashoffset=201-(201*pct/100);
 $('#ringPct').textContent=pct+'%';
 $('#ringDone').textContent=done;$('#ringTotal').textContent=total;
 // серия дней
 const days=new Set(state.tasks.filter(t=>t.completedAt).map(t=>ymd(new Date(t.completedAt))));
 let streak=0,cur=new Date();
 if(!days.has(ymd(cur)))cur.setDate(cur.getDate()-1);
 while(days.has(ymd(cur))){streak++;cur.setDate(cur.getDate()-1)}
 $('#streakN').textContent=streak+' '+plural(streak,['день','дня','дней']);
 $('#totalN').textContent=state.tasks.filter(t=>t.done).length;}
function renderAll(){renderNav();renderTabs();renderList();renderStats();}

/* ── действия ── */
function addTask(){
 const inp=$('#newText'),text=inp.value.trim();
 if(!text){$('#composer').classList.remove('shake');void $('#composer').offsetWidth;$('#composer').classList.add('shake');inp.focus();return}
 state.tasks.unshift({id:uid(),text,catId:state.newCat,prio:state.newPrio,due:$('#newDue').value||null,done:false,createdAt:Date.now()});
 if(state.tab!=='active')state.tab='active';
 inp.value='';$('#newDue').value='';save();renderAll();sndTick();inp.focus();}
$('#addBtn').onclick=addTask;
$('#newText').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

$('#catPicker').addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;state.newCat=b.dataset.pick;save();renderPicker()});
$('#prioPick').addEventListener('click',e=>{const b=e.target.closest('.prio');if(!b)return;
 state.newPrio=state.newPrio===b.dataset.p?null:b.dataset.p;
 $$('#prioPick .prio').forEach(x=>x.classList.toggle('on',x.dataset.p===state.newPrio));});

$('#newDue').min=ymd(new Date());

function toggleDone(id,li){
 const t=byId(id);if(!t)return;
 if(!t.done){
  if(li.dataset.busy)return;li.dataset.busy='1';li.classList.add('finishing');
  const r=li.querySelector('.check').getBoundingClientRect();
  burst(r.left+13,r.top+13,[catById(t.catId).color,'#F2C14E','#fff'],22,1);sndPop();
  const wasAll=state.tasks.length>0&&state.tasks.every(x=>x.done||x.id===id);
  setTimeout(()=>{t.done=true;t.completedAt=Date.now();save();renderAll();
   if(wasAll){setTimeout(()=>{burst(innerWidth/2,innerHeight*.32,FXC,70,1.7);burst(innerWidth*.2,innerHeight*.4,FXC,30,1.3);burst(innerWidth*.8,innerHeight*.4,FXC,30,1.3);sndFanfare();toast('МашаАлла! Все задачи выполнены 🎉')},150)}},520);
 }else{t.done=false;t.completedAt=null;state.tab='active';save();renderAll();sndTick();}}

function removeTask(id,li){
 li.classList.add('removing');
 setTimeout(()=>{const snap=[...state.tasks];state.tasks=state.tasks.filter(t=>t.id!==id);save();renderAll();
  toast('Задача удалена',()=>{state.tasks=snap;save();renderAll()})},200);}

$('#list').addEventListener('click',e=>{
 const li=e.target.closest('.task');if(!li)return;const id=li.dataset.id;
 if(e.target.closest('.check'))return toggleDone(id,li);
 const act=e.target.closest('[data-act]');if(!act)return;
 if(act.dataset.act==='del')return removeTask(id,li);
 if(act.dataset.act==='edit'){state.editing=id;renderList();}});
$('#list').addEventListener('keydown',e=>{
 if(!e.target.classList.contains('t-edit'))return;const li=e.target.closest('.task');
 if(e.key==='Enter'){commitEdit(li)}
 if(e.key==='Escape'){state.editing=null;renderList()}});
$('#list').addEventListener('focusout',e=>{
 if(e.target.classList.contains('t-edit'))commitEdit(e.target.closest('.task'))});
function commitEdit(li){if(!li||!state.editing)return;const t=byId(li.dataset.id);
 const v=li.querySelector('.t-edit').value.trim();if(v)t.text=v;
 state.editing=null;save();renderAll();}

/* drag & drop порядка */
let dragEl=null;
$('#list').addEventListener('dragstart',e=>{const li=e.target.closest('.task');if(!li)return;
 dragEl=li;requestAnimationFrame(()=>li.classList.add('dragging'))});
$('#list').addEventListener('dragover',e=>{e.preventDefault();if(!dragEl)return;
 const els=[...$('#list').querySelectorAll('.task:not(.dragging)')];
 const after=els.reduce((best,el)=>{const r=el.getBoundingClientRect(),off=e.clientY-r.top-r.height/2;
  return off<0&&off>best.off?{off,el}:best},{off:-Infinity,el:null}).el;
 after?$('#list').insertBefore(dragEl,after):$('#list').appendChild(dragEl)});
$('#list').addEventListener('dragend',()=>{if(!dragEl)return;dragEl.classList.remove('dragging');
 const ids=[...$('#list').querySelectorAll('.task')].map(l=>l.dataset.id);
 const ordered=ids.map(byId).filter(Boolean);
 state.tasks=[...ordered,...state.tasks.filter(t=>t.done)];save();dragEl=null});

/* вкладки, поиск, очистка */
$$('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();renderTabs();renderList()});
$('#search').addEventListener('input',e=>{state.search=e.target.value.trim().toLowerCase();renderList()});
$('#clearDone').onclick=()=>{const snap=[...state.tasks];
 state.tasks=state.tasks.filter(t=>!(t.done&&matchF(t)));save();renderAll();
 toast('Выполненные очищены',()=>{state.tasks=snap;save();renderAll()})};

/* навигация по категориям */
function navClick(e){
 const del=e.target.closest('[data-del]');
 if(del){e.stopPropagation();return deleteCat(del.dataset.del)}
 const row=e.target.closest('[data-f]');if(!row)return;
 state.filter=row.dataset.f;save();renderNav();renderTabs();renderList();renderStats();}
$('#catNav').addEventListener('click',navClick);
$('#catNavM').addEventListener('click',navClick);
function deleteCat(id){
 const c=catById(id);if(c.fixed)return;
 const snap=[...state.tasks],snapCats=[...state.cats];
 state.tasks.forEach(t=>{if(t.catId===id)t.catId='general'});
 state.cats=state.cats.filter(x=>x.id!==id);
 if(state.filter===id)state.filter='all';
 if(state.newCat===id)state.newCat='general';
 save();renderAll();
 toast(`Категория «${c.name}» удалена`,()=>{state.tasks=snap;state.cats=snapCats;save();renderAll()});}

/* ── диалог категории ── */
const dlg=$('#dlg');let dlgEmoji='✨',dlgColor='#4A8DF7';
$('#egrid').innerHTML=EMOJIS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join('');
$('#cgrid').innerHTML=PALETTE.map(c=>`<button type="button" data-c="${c}" style="background:${c}"></button>`).join('');
function markDlg(){$$('#egrid button').forEach(b=>b.classList.toggle('on',b.dataset.e===dlgEmoji));
 $$('#cgrid button').forEach(b=>b.classList.toggle('on',b.dataset.c===dlgColor))}
$('#egrid').onclick=e=>{const b=e.target.closest('button');if(b){dlgEmoji=b.dataset.e;markDlg()}};
$('#cgrid').onclick=e=>{const b=e.target.closest('button');if(b){dlgColor=b.dataset.c;markDlg()}};
$('#addCatBtn').onclick=()=>{$('#catName').value='';dlgEmoji='✨';dlgColor=PALETTE[Math.floor(Math.random()*PALETTE.length)];markDlg();dlg.showModal();setTimeout(()=>$('#catName').focus(),50)};
$('#dlgCancel').onclick=()=>dlg.close();
$('#catForm').addEventListener('submit',e=>{e.preventDefault();
 const name=$('#catName').value.trim();if(!name)return;
 const cat={id:uid(),name,emoji:dlgEmoji,color:dlgColor};
 state.cats.push(cat);state.newCat=cat.id;state.filter=cat.id;save();renderAll();dlg.close();
 burst(innerWidth/2,innerHeight/2,[dlgColor,'#fff'],30,1.2);
 toast(`Категория «${name}» создана ${dlgEmoji}`);});

/* ── тема и звук ── */
function effTheme(){return state.settings.theme||((new Date().getHours()>=19||new Date().getHours()<7)?'dark':'light')}
function applyToggles(){
 document.documentElement.dataset.theme=effTheme();
 $$('.theme-btn').forEach(b=>b.textContent=effTheme()==='dark'?'☀️':'🌙');
 $$('.sound-btn').forEach(b=>b.textContent=state.settings.sound?'🔊':'🔇');}
$$('.theme-btn').forEach(b=>b.onclick=()=>{state.settings.theme=effTheme()==='dark'?'light':'dark';save();applyToggles()});
$$('.sound-btn').forEach(b=>b.onclick=()=>{state.settings.sound=!state.settings.sound;save();applyToggles();if(state.settings.sound)sndTick()});

/* ── приветствие, дата, цитата ── */
function renderHello(){
 const now=new Date(),h=now.getHours();
 const [g,em]=h>=5&&h<11?['Доброе утро','☀️']:h>=11&&h<17?['Добрый день','🌤️']:h>=17&&h<23?['Добрый вечер','🌆']:['Доброй ночи','🌙'];
 $('#greet').textContent=`${g}, Руслан ${em}`;
 let d=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
 $('#dateline').innerHTML=`${d[0].toUpperCase()+d.slice(1)} · <b id="clock"></b>`;
 $('#quote').textContent=QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length];
 tickClock();}
function tickClock(){const c=$('#clock');if(c){const n=new Date();
 c.textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`}}
setInterval(tickClock,20000);

/* ── хоткеи ── */
document.addEventListener('keydown',e=>{
 const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName)||dlg.open;
 if(e.key==='/'&&!typing){e.preventDefault();$('#search').focus()}
 if(e.key==='Escape'&&state.editing){state.editing=null;renderList()}});

/* ── старт ── */
load();applyToggles();renderHello();renderAll();
</script>
</body>
</html>
